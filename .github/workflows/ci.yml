name: BotolaHub CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botolahub
          POSTGRES_PASSWORD: botolahub_secret
          POSTGRES_DB: botolahub_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: "postgresql://botolahub:botolahub_secret@127.0.0.1:5432/botolahub_db?schema=public"

      - name: Apply Database Migrations & Seed
        run: |
          pnpm --filter @botolahub/database db:migrate
          pnpm --filter @botolahub/database db:seed
        env:
          DATABASE_URL: "postgresql://botolahub:botolahub_secret@127.0.0.1:5432/botolahub_db?schema=public"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Integration Tests
        run: pnpm test
        env:
          DATABASE_URL: "postgresql://botolahub:botolahub_secret@127.0.0.1:5432/botolahub_db?schema=public"
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "6379"

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://botolahub:botolahub_secret@127.0.0.1:5432/botolahub_db?schema=public"
