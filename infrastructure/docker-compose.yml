services:
  postgres:
    image: postgres:16-alpine
    container_name: botolahub_postgres
    restart: always
    environment:
      POSTGRES_USER: botolahub
      POSTGRES_PASSWORD: botolahub_secret
      POSTGRES_DB: botolahub_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botolahub -d botolahub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: botolahub_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
