version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: botolahub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botolahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botolahub_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-botolahub_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-botolahub} -d ${POSTGRES_DB:-botolahub_dev}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: botolahub_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: botolahub_postgres_data
  redis_data:
    name: botolahub_redis_data
